<!doctype html>
<!--
  Paints the logotype in the navigation bar (site/layouts/partials/nav.html):
  the cursive character of tools/ref/logotype-ref.png, written again with
  p5.brush, in the theme orange.

  The character comes from tools/logotype-data.js (made by
  tools/logotype-trace.py): its strokes as centre lines, each point with
  the stroke's width there. Every mark is p5.brush's: each stroke is laid
  as watercolour, a band round its centre line as wide as the traced
  width, in translucent glazes that bleed and pool at their edges. Nothing
  is clipped to the reference; pigment is kept only near the bands the
  brush laid, as p5.brush throws stray spikes off long outlines.

  Open this file in a browser with WebGL2 and save the result as
  site/static/img/logotype.webp. Painting is seeded, so the same SEED
  gives the same logotype.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Logotype</title>
  <style>
    body { margin: 16px; font-family: sans-serif; background: #ffffff; color: #14213d; }
    body > canvas, main > canvas { display: none; }
    img { display: block; margin-bottom: 16px; background: #14213d; padding: 12px; }
    a { color: #14213d; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js" integrity="sha384-Cs48F1uukMPysq29xNsf/FZL5ZNGsPfi6lDSGOxo6dypVFFiWO9Q3YbRKoXPPBii" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5.brush@2.2.3/dist/p5.brush.js" integrity="sha384-kwWM3zLjD/CdRap70WTKAsSsnuRP+m8UUSUCTvKE0YT9kCV50Lf9T33B819pu4hh" crossorigin="anonymous"></script>
  <script src="logotype-data.js"></script>
</head>
<body>
  <p id="status">Painting…</p>
  <script>
    // Top-level names must not clash with p5's globals (see lessons.md).
    var SEED = 5;
    var BRUSH_SCALE = 1;
    var PAD = 24;                 // px of paper round the character
    var GLYPH_W = LOGOTYPE.w + 2 * PAD;
    var GLYPH_H = LOGOTYPE.h + 2 * PAD;
    var OUT_H = 288;              // px of the saved logotype's height: 3x the most it is shown at
    var INK = [252, 163, 17];     // the theme orange
    var BAND_EDGE = 6;            // px past a band's outline that its bleed may reach
    var GLAZES = 4;

    // Trace px -> WEBGL coordinates (origin at the canvas middle).
    function at(x, y) { return [x + PAD - GLYPH_W / 2, y + PAD - GLYPH_H / 2]; }

    // The outline of a band along a line of points, half-width hw[i] at
    // point i, with round ends.
    function band(pts, hw) {
      var left = [], right = [], dirs = [];
      pts.forEach(function (q, i) {
        var a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
        var nx = b[1] - a[1], ny = a[0] - b[0], len = Math.hypot(nx, ny) || 1;
        dirs.push(Math.atan2(ny, nx));
        left.push([q[0] + nx / len * hw[i], q[1] + ny / len * hw[i]]);
        right.push([q[0] - nx / len * hw[i], q[1] - ny / len * hw[i]]);
      });
      // Half a circle round an end, from one side of the band to the other.
      function cap(i, from) {
        var out = [];
        for (var k = 1; k < 6; k++) {
          var t = from + Math.PI * k / 6;
          out.push([pts[i][0] + Math.cos(t) * hw[i], pts[i][1] + Math.sin(t) * hw[i]]);
        }
        return out;
      }
      var last = pts.length - 1;
      return left.concat(cap(last, dirs[last]), right.reverse(), cap(0, dirs[0] + Math.PI));
    }

    // Points a distance `off` (px) to one side of a stroke's centre line.
    function beside(stroke, off) {
      return stroke.map(function (q, i) {
        var a = stroke[Math.max(0, i - 1)], b = stroke[Math.min(stroke.length - 1, i + 1)];
        var nx = b[1] - a[1], ny = a[0] - b[0], len = Math.hypot(nx, ny) || 1;
        var o = off * q[2] / 2;
        return [q[0] + nx / len * o, q[1] + ny / len * o, q[2]];
      });
    }

    var bands = [];               // the outline of each stroke's widest glaze

    function paintGlyph() {
      brush.noStroke();
      LOGOTYPE.strokes.forEach(function (s) {
        // The stroke's typical width, and its pressure along it:
        // the traced width, smoothed along the stroke and capped (where
        // strokes meet, the trace measures the whole junction), tapering
        // to a lifted tip at a free end that thins.
        var widths = s.map(function (q) { return q[2]; }).sort(function (a, b) { return a - b; });
        var typical = Math.max(4, widths[Math.floor(widths.length / 2)]);
        // A running median, so a junction's width does not swell it.
        var press = s.map(function (q, i) {
          var near = [];
          for (var j = Math.max(0, i - 5); j <= Math.min(s.length - 1, i + 5); j++) near.push(s[j][2]);
          near.sort(function (a, b) { return a - b; });
          return Math.min(1.15, Math.max(0.15, near[Math.floor(near.length / 2)] / typical));
        });
        // Each free end that thins goes to a sharp tip.
        [0, s.length - 1].forEach(function (e) {
          if (s[e][2] > 0.6 * widths[widths.length - 1]) return;
          for (var t = 0; t < Math.min(10, s.length); t++) {
            var i = e ? s.length - 1 - t : t;
            press[i] *= 0.15 + 0.85 * t / 10;
          }
        });
        // The stroke as watercolour: a band round its centre line, as wide
        // as the pressure says, laid in translucent glazes, each a little
        // narrower. Each band is kept for the mask (see draw()).
        var hw = press.map(function (p) { return p * typical / 2; });
        for (var g = 0; g < GLAZES; g++) {
          var narrow = 1 - 0.35 * g / Math.max(1, GLAZES - 1);
          var shape = band(s, hw.map(function (w) { return w * narrow * random(0.92, 1.08); }));
          if (!g) bands.push(shape);
          brush.fill(0, 0, 0, random(90, 130));
          brush.fillBleed(random(0.08, 0.2), "out");
          brush.fillTexture(random(0.3, 0.5), random(0.05, 0.15), true);
          brush.polygon(shape.map(function (q) { return at(q[0], q[1]); }));
        }
        brush.noFill();
      });

      brush.noField();
    }

    function setup() {
      createCanvas(GLYPH_W, GLYPH_H, WEBGL);
      pixelDensity(1);
      randomSeed(SEED);
      noiseSeed(SEED);
      background(255);
      brush.scaleBrushes(BRUSH_SCALE);
      brush.noField();
      paintGlyph();
    }

    // p5.brush throws faint spikes off a long, bent outline (lessons.md):
    // pigment is kept only within BAND_EDGE px of the bands painted, with a
    // soft edge. 1 inside, in canvas px.
    function bandMask() {
      var c = document.createElement("canvas");
      c.width = GLYPH_W;
      c.height = GLYPH_H;
      var ctx = c.getContext("2d");
      ctx.filter = "blur(" + BAND_EDGE / 2 + "px)";
      ctx.fillStyle = "#000";
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 2 * BAND_EDGE;
      ctx.lineJoin = "round";
      bands.forEach(function (b) {
        ctx.beginPath();
        b.forEach(function (q, i) {
          if (i) ctx.lineTo(q[0] + PAD, q[1] + PAD); else ctx.moveTo(q[0] + PAD, q[1] + PAD);
        });
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      });
      var data = ctx.getImageData(0, 0, GLYPH_W, GLYPH_H).data;
      var mask = new Float32Array(GLYPH_W * GLYPH_H);
      for (var k = 0; k < mask.length; k++) mask[k] = data[4 * k + 3] / 255;
      return mask;
    }

    function draw() {
      noLoop();
      loadPixels();
      var d = pixelDensity();
      var full = document.createElement("canvas");
      full.width = GLYPH_W;
      full.height = GLYPH_H;
      var fctx = full.getContext("2d");
      var img = fctx.createImageData(GLYPH_W, GLYPH_H);
      var mask = bandMask();
      var dens = new Float32Array(GLYPH_W * GLYPH_H), max = 0, k;
      for (var y = 0; y < GLYPH_H; y++) {
        for (var x = 0; x < GLYPH_W; x++) {
          var q = 4 * (y * d * GLYPH_W * d + x * d);
          k = y * GLYPH_W + x;
          dens[k] = (1 - (pixels[q] + pixels[q + 1] + pixels[q + 2]) / 765) * mask[k];
        }
      }
      // The densest paint: the 98th percentile of the painted pixels.
      var painted = Array.prototype.filter.call(dens, function (v) { return v > 0.02; }).sort(function (a, b) { return a - b; });
      max = painted.length ? painted[Math.floor(painted.length * 0.98)] : 1;
      for (k = 0; k < dens.length; k++) {
        img.data[4 * k] = INK[0];
        img.data[4 * k + 1] = INK[1];
        img.data[4 * k + 2] = INK[2];
        // Density against the densest paint, so the washes keep their tones.
        img.data[4 * k + 3] = Math.round(255 * Math.pow(Math.min(1, dens[k] / (max || 1)), 0.65));
      }
      fctx.putImageData(img, 0, 0);
      var out = document.createElement("canvas");
      out.height = OUT_H;
      out.width = Math.round(OUT_H * GLYPH_W / GLYPH_H);
      var octx = out.getContext("2d");
      octx.imageSmoothingQuality = "high";
      octx.drawImage(full, 0, 0, out.width, out.height);
      var url = out.toDataURL("image/webp", 0.92);
      window.atlasDataURL = url;

      var link = document.createElement("a");
      link.href = url;
      link.download = "logotype.webp";
      link.textContent = "Download logotype.webp (" + out.width + " x " + out.height + ")";
      document.getElementById("status").replaceChildren(link);
      var big = document.createElement("img");
      big.src = full.toDataURL("image/png");
      big.style.width = "400px";
      document.body.appendChild(big);
      var preview = document.createElement("img");
      preview.src = url;
      preview.style.height = "44px";
      document.body.appendChild(preview);
    }
  </script>
</body>
</html>
