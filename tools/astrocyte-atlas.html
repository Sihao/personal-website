<!doctype html>
<!--
  Paints the sprite atlas used by site/static/js/sketches/astrocytes.js.

  Open this file in a browser with WebGL2. It produces two images:
    astrocytes.webp         white, with alpha = pigment density
    astrocytes-labels.png   the compartment each pixel belongs to, in the red
                            channel: 1 = soma, 2-99 = processes,
                            100-255 = microdomains, 0 = nothing
  Save both to site/static/img/.

  p5.brush paints each astrocyte's soma and processes in black watercolor on
  white, without the streaked fill texture. The cloud of fine processes around
  them, and the patches of neuropil between cells, are soft noise rather than
  brush washes: in two-photon images that tissue is a diffuse haze, not a set
  of discs. The haze is split into microdomains of roughly equal size so that
  each can light up on its own.

  Painting is seeded, so the same SEED gives the same atlas.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Astrocyte atlas</title>
  <style>
    body { margin: 16px; font-family: sans-serif; background: #14213d; color: #e5e5e5; }
    body > canvas, main > canvas { display: none; }
    img { display: block; max-width: 100%; margin-bottom: 16px; background: #14213d; }
    a { color: #fca311; margin-right: 16px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js" integrity="sha384-Cs48F1uukMPysq29xNsf/FZL5ZNGsPfi6lDSGOxo6dypVFFiWO9Q3YbRKoXPPBii" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5.brush@2.2.3/dist/p5.brush.js" integrity="sha384-kwWM3zLjD/CdRap70WTKAsSsnuRP+m8UUSUCTvKE0YT9kCV50Lf9T33B819pu4hh" crossorigin="anonymous"></script>
</head>
<body>
  <p id="status">Painting…</p>
  <script>
    // Keep in sync with astrocytes.js.
    var CELL = 320;
    var COLS = 4;
    var ASTROCYTES = 6;
    var NEUROPIL = 2;
    var SOMA = 1;
    var PROCESS0 = 2;
    var DOMAIN0 = 100;

    var SEED = 7;
    var DOMAIN_SPACING = 34;      // px between microdomain centres
    var CLOUD_LEVEL = 0.4;        // density of the haze relative to the processes
    var NEUROPIL_LEVEL = 0.55;

    var W = COLS * CELL;
    var H = Math.ceil((ASTROCYTES + NEUROPIL) / COLS) * CELL;
    var R = CELL / 2;

    var shapes = [];              // {cell, label, pts}: painted outlines, atlas px
    var nextProcess = PROCESS0;

    // Atlas pixel coordinates -> WEBGL coordinates (origin at the centre).
    function P(q) { return [q[0] - W / 2, q[1] - H / 2]; }

    // Closed irregular outline around (cx, cy).
    function blob(cx, cy, r, roughness, n) {
      var pts = [];
      var phase = random(1000);
      for (var i = 0; i < n; i++) {
        var a = (i / n) * TWO_PI;
        var k = 1 + roughness * (noise(phase + Math.cos(a), phase + Math.sin(a)) * 2 - 1);
        pts.push([cx + Math.cos(a) * r * k, cy + Math.sin(a) * r * k]);
      }
      return pts;
    }

    // Smoothly curving centreline from (x, y) with initial heading a: the
    // curvature, not the heading, takes a damped random walk.
    function wander(x, y, a, length, steps, wiggle) {
      var pts = [[x, y]];
      var ds = length / steps;
      var k = 0;
      for (var i = 0; i < steps; i++) {
        k = 0.7 * k + random(-wiggle, wiggle);
        a += k;
        x += Math.cos(a) * ds;
        y += Math.sin(a) * ds;
        pts.push([x, y]);
      }
      return pts;
    }

    function widthAt(i, n, w0, w1) {
      return w1 + (w0 - w1) * Math.pow(1 - i / (n - 1), 0.9);
    }

    // Tapered polygon around a centreline.
    function ribbon(path, w0, w1) {
      var left = [];
      var right = [];
      var n = path.length;
      for (var i = 0; i < n; i++) {
        var a = path[Math.max(0, i - 1)];
        var b = path[Math.min(n - 1, i + 1)];
        var tx = b[0] - a[0];
        var ty = b[1] - a[1];
        var len = Math.hypot(tx, ty) || 1;
        var w = widthAt(i, n, w0, w1) / 2;
        left.push([path[i][0] - (ty / len) * w, path[i][1] + (tx / len) * w]);
        right.push([path[i][0] + (ty / len) * w, path[i][1] - (tx / len) * w]);
      }
      return left.concat(right.reverse());
    }

    function heading(path, i) {
      var a = path[Math.max(0, i - 1)];
      var b = path[Math.min(path.length - 1, i + 1)];
      return Math.atan2(b[1] - a[1], b[0] - a[0]);
    }

    // One smooth wash: no fill texture, so the interior stays even, and a
    // faint darkened rim at the edge of the pigment.
    function paint(cell, label, pts, opacity, bleed) {
      shapes.push({ cell: cell, label: label, pts: pts });
      brush.fill(0, 0, 0, opacity);
      brush.fillBleed(bleed, "out");
      brush.fillTexture(0, 0.15, false);
      brush.polygon(pts.map(P));
    }

    // A primary process (depth 0) and its branches. Each primary, and each
    // branch off it together with its own twigs, is a separate compartment.
    function process(cell, x, y, a, length, w0, depth, label) {
      var steps = Math.max(6, Math.round(length / 6));
      var path = wander(x, y, a, length, steps, 0.09);
      var w1 = Math.max(1.2, w0 * 0.12);
      paint(cell, label, ribbon(path, w0, w1), depth === 0 ? 90 : 70, 0.1);
      if (depth >= 2) return;
      var children = depth === 0 ? floor(random(2, 4)) : floor(random(0, 3));
      for (var k = 0; k < children; k++) {
        var j = floor(random(0.25, 0.8) * steps);
        var side = random() < 0.5 ? -1 : 1;
        process(
          cell, path[j][0], path[j][1],
          heading(path, j) + side * random(0.3, 0.7),
          length * (1 - j / steps) * random(0.7, 1.1),
          widthAt(j, steps + 1, w0, w1) * 0.7,
          depth + 1,
          depth === 0 ? Math.min(DOMAIN0 - 1, nextProcess++) : label
        );
      }
    }

    function astrocyte(cell, cx, cy) {
      nextProcess = PROCESS0;
      var n = floor(random(6, 10));
      var a0 = random(TWO_PI);
      for (var i = 0; i < n; i++) {
        var a = a0 + (i / n) * TWO_PI + random(-0.3, 0.3);
        var r0 = R * 0.07;
        process(cell, cx + Math.cos(a) * r0, cy + Math.sin(a) * r0, a,
          R * random(0.55, 0.9), R * random(0.07, 0.11), 0,
          Math.min(DOMAIN0 - 1, nextProcess++));
      }
      paint(cell, SOMA, blob(cx, cy, R * 0.13, 0.3, 40), 150, 0.15);
    }

    // ---- Pixel work on one CELL x CELL tile -------------------------------

    function ramp(e0, e1, x) {
      var t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
      return t * t * (3 - 2 * t);
    }

    // Approximate Gaussian blur of standard deviation ~r: three box passes.
    function boxBlur(src, r) {
      var n = CELL;
      var a = Float32Array.from(src);
      var b = new Float32Array(n * n);
      var k = Math.max(1, Math.round(r * 0.87));
      for (var pass = 0; pass < 3; pass++) {
        for (var dir = 0; dir < 2; dir++) {
          for (var line = 0; line < n; line++) {
            var acc = 0;
            var idx = function (i) {
              i = Math.min(n - 1, Math.max(0, i));
              return dir ? i * n + line : line * n + i;
            };
            for (var i = -k; i <= k; i++) acc += a[idx(i)];
            for (i = 0; i < n; i++) {
              b[idx(i)] = acc / (2 * k + 1);
              acc += a[idx(i + k + 1)] - a[idx(i - k)];
            }
          }
          var t = a; a = b; b = t;
        }
      }
      return a;
    }

    function inside(pts, x, y) {
      var c = false;
      for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        var xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
        if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
      }
      return c;
    }

    // Fractal noise in [0, 1].
    function fbm(x, y, scale) {
      return noise(x * scale, y * scale);
    }

    function tile(cell, density, labels) {
      var ox = (cell % COLS) * CELL;
      var oy = Math.floor(cell / COLS) * CELL;
      var n = CELL * CELL;
      var d = pixelDensity();
      var S = new Float32Array(n);    // brushwork density
      var L = new Uint8Array(n);      // labels
      var M = new Float32Array(n);    // 1 inside a painted outline
      var x, y, i, k;

      for (y = 0; y < CELL; y++) {
        for (x = 0; x < CELL; x++) {
          k = 4 * ((oy + y) * d * W * d + (ox + x) * d);
          S[y * CELL + x] = 1 - (pixels[k] + pixels[k + 1] + pixels[k + 2]) / 765;
        }
      }

      // Rasterise the outlines; later shapes (the soma) win.
      shapes.forEach(function (s) {
        if (s.cell !== cell) return;
        var x0 = CELL, y0 = CELL, x1 = 0, y1 = 0;
        s.pts.forEach(function (q) {
          x0 = Math.min(x0, q[0] - ox); x1 = Math.max(x1, q[0] - ox);
          y0 = Math.min(y0, q[1] - oy); y1 = Math.max(y1, q[1] - oy);
        });
        for (y = Math.max(0, Math.floor(y0)); y <= Math.min(CELL - 1, Math.ceil(y1)); y++) {
          for (x = Math.max(0, Math.floor(x0)); x <= Math.min(CELL - 1, Math.ceil(x1)); x++) {
            if (inside(s.pts, ox + x + 0.5, oy + y + 0.5)) {
              L[y * CELL + x] = s.label;
              M[y * CELL + x] = 1;
            }
          }
        }
      });

      // Even out the interior of the processes and soma: where a pixel is
      // well inside an outline, replace the brushwork with a blurred copy,
      // keeping the irregular watercolor edge.
      var Sb = boxBlur(S, 2.5);
      var Mb = boxBlur(M, 3);
      for (i = 0; i < n; i++) {
        var w = ramp(0.45, 0.9, Mb[i]);
        S[i] = S[i] * (1 - w) + Sb[i] * w;
      }

      // The haze: fractal noise under an envelope. Around an astrocyte the
      // envelope follows its processes; in neuropil it is a few soft patches.
      var E;
      var level;
      if (L.some(function (v) { return v > 0; })) {
        E = boxBlur(M, 14);
        var emax = 0;
        for (i = 0; i < n; i++) emax = Math.max(emax, E[i]);
        level = CLOUD_LEVEL;
        for (i = 0; i < n; i++) E[i] = Math.pow(E[i] / emax, 0.5);
      } else {
        E = new Float32Array(n);
        var patches = floor(random(8, 12));
        for (k = 0; k < patches; k++) {
          var pa = random(TWO_PI);
          var pd = R * Math.sqrt(random()) * 0.65;
          var px = R + Math.cos(pa) * pd;
          var py = R + Math.sin(pa) * pd;
          var ps = R * random(0.12, 0.22);
          for (y = 0; y < CELL; y++) {
            for (x = 0; x < CELL; x++) {
              var g = Math.exp(-((x - px) * (x - px) + (y - py) * (y - py)) / (2 * ps * ps));
              E[y * CELL + x] = Math.max(E[y * CELL + x], g);
            }
          }
        }
        level = NEUROPIL_LEVEL;
      }
      var C = new Float32Array(n);
      var phase = random(1000);
      for (y = 0; y < CELL; y++) {
        for (x = 0; x < CELL; x++) {
          i = y * CELL + x;
          var r = Math.hypot(x - R, y - R);
          var edge = ramp(R * 0.98, R * 0.7, r);
          var lumps = ramp(0.3, 0.75, fbm(x + phase, y, 0.035));
          var grain = 0.75 + 0.5 * fbm(x, y + phase, 0.3);
          C[i] = E[i] * edge * lumps * grain * level;
        }
      }

      // Combine, normalise and write the density tile.
      var D = new Float32Array(n);
      var max = 0;
      for (i = 0; i < n; i++) {
        D[i] = 1 - (1 - Math.min(1, S[i])) * (1 - C[i]);
        if (D[i] > max) max = D[i];
      }
      for (i = 0; i < n; i++) D[i] /= max || 1;

      // Grow the structure labels a few pixels into the watercolor bleed.
      for (var grow = 0; grow < 3; grow++) {
        var next = Uint8Array.from(L);
        for (y = 1; y < CELL - 1; y++) {
          for (x = 1; x < CELL - 1; x++) {
            i = y * CELL + x;
            if (L[i] || S[i] < 0.03) continue;
            next[i] = L[i - 1] || L[i + 1] || L[i - CELL] || L[i + CELL];
          }
        }
        L = next;
      }

      // Microdomains: the rest of the pigment, split among seeds scattered
      // through the haze at roughly even spacing.
      var seeds = [];
      for (k = 0; k < 6000 && seeds.length < 255 - DOMAIN0; k++) {
        var sx = random(CELL);
        var sy = random(CELL);
        if (C[floor(sy) * CELL + floor(sx)] < 0.08 * level) continue;
        if (seeds.every(function (q) { return Math.hypot(q[0] - sx, q[1] - sy) > DOMAIN_SPACING; })) {
          seeds.push([sx, sy]);
        }
      }
      for (y = 0; y < CELL; y++) {
        for (x = 0; x < CELL; x++) {
          i = y * CELL + x;
          if (L[i] || D[i] < 0.01) continue;
          var best = 0;
          var bestD = Infinity;
          for (k = 0; k < seeds.length; k++) {
            var dd = (seeds[k][0] - x) * (seeds[k][0] - x) + (seeds[k][1] - y) * (seeds[k][1] - y);
            if (dd < bestD) { bestD = dd; best = k; }
          }
          L[i] = DOMAIN0 + best;
        }
      }

      for (y = 0; y < CELL; y++) {
        for (x = 0; x < CELL; x++) {
          i = y * CELL + x;
          var o = 4 * ((oy + y) * W + ox + x);
          density.data[o] = density.data[o + 1] = density.data[o + 2] = 255;
          density.data[o + 3] = Math.round(255 * Math.pow(Math.min(1, D[i]), 0.85));
          labels.data[o] = labels.data[o + 1] = labels.data[o + 2] = D[i] < 0.01 ? 0 : L[i];
          labels.data[o + 3] = 255;
        }
      }
      return seeds.length;
    }

    function setup() {
      createCanvas(W, H, WEBGL);
      pixelDensity(1);
      randomSeed(SEED);
      noiseSeed(SEED);
      noiseDetail(4, 0.5);
      background(255);
      brush.noStroke();
      for (var i = 0; i < ASTROCYTES; i++) {
        astrocyte(i, (i % COLS + 0.5) * CELL, (Math.floor(i / COLS) + 0.5) * CELL);
      }
    }

    function exported(canvas, type, name, quality) {
      var url = canvas.toDataURL(type, quality);
      var link = document.createElement("a");
      link.href = url;
      link.download = name;
      link.textContent = "Download " + name;
      document.getElementById("status").appendChild(link);
      return url;
    }

    // p5.brush composites the painting when setup() returns.
    function draw() {
      noLoop();
      loadPixels();
      function canvas2d() {
        var c = document.createElement("canvas");
        c.width = W;
        c.height = H;
        return c;
      }
      var dc = canvas2d();
      var lc = canvas2d();
      var density = dc.getContext("2d").createImageData(W, H);
      var labels = lc.getContext("2d").createImageData(W, H);
      for (var i = 0; i < W * H; i++) labels.data[4 * i + 3] = 255;
      var domains = [];
      for (var c = 0; c < ASTROCYTES + NEUROPIL; c++) domains.push(tile(c, density, labels));
      dc.getContext("2d").putImageData(density, 0, 0);
      lc.getContext("2d").putImageData(labels, 0, 0);

      document.getElementById("status").textContent = "Microdomains per tile: " + domains.join(", ") + ". ";
      window.atlasDataURL = exported(dc, "image/webp", "astrocytes.webp", 0.9);
      window.atlasLabelsURL = exported(lc, "image/png", "astrocytes-labels.png");

      var preview = document.createElement("img");
      preview.src = window.atlasDataURL;
      document.body.appendChild(preview);
    }
  </script>
</body>
</html>
