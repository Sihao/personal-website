<!doctype html>
<!--
  Paints the sprite atlas used by site/static/js/sketches/washes.js.

  Open this file in a browser with WebGL2 and save the result as
  site/static/img/washes.webp. The atlas is white, with alpha = pigment
  density, so the sketch can tint each sprite with any colour. Its tiles are,
  in order:
    - BLOBS  watercolour blots: irregular, elongated along x, one to three
             translucent glazes each, with p5.brush bleed and texture;
    - SPRAYS trails of spray dust running along x;
    - ZIGZAGS  jagged pencil and charcoal zigzags running along x.
  The sketch rotates every sprite to the flow of the composition.

  Painting is seeded, so the same SEED gives the same atlas.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wash atlas</title>
  <style>
    body { margin: 16px; font-family: sans-serif; background: #14213d; color: #e5e5e5; }
    body > canvas, main > canvas { display: none; }
    img { display: block; max-width: 100%; margin-bottom: 16px; background: #14213d; }
    a { color: #fca311; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js" integrity="sha384-Cs48F1uukMPysq29xNsf/FZL5ZNGsPfi6lDSGOxo6dypVFFiWO9Q3YbRKoXPPBii" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5.brush@2.2.3/dist/p5.brush.js" integrity="sha384-kwWM3zLjD/CdRap70WTKAsSsnuRP+m8UUSUCTvKE0YT9kCV50Lf9T33B819pu4hh" crossorigin="anonymous"></script>
</head>
<body>
  <p id="status">Painting…</p>
  <script>
    // Keep in sync with washes.js.
    var TILE = 200;
    var COLS = 7;
    var BLOBS = 16;
    var SPRAYS = 4;
    var ZIGZAGS = 8;

    var SEED = 11;
    var BRUSH_SCALE = 1.5;        // brush.scaleBrushes() for 200 px tiles

    var COUNT = BLOBS + SPRAYS + ZIGZAGS;
    var W = COLS * TILE;
    var H = Math.ceil(COUNT / COLS) * TILE;

    function origin(i) {
      return [(i % COLS) * TILE, Math.floor(i / COLS) * TILE];
    }

    // Atlas pixel coordinates -> WEBGL coordinates (origin at the centre).
    function P(q) { return [q[0] - W / 2, q[1] - H / 2]; }

    // Irregular closed outline, elongated along x: low-frequency noise for
    // the overall lopsidedness, higher-frequency noise for a ragged edge.
    function outline(cx, cy, rx, ry, rough, n) {
      var pts = [];
      var phase = random(1000);
      for (var k = 0; k < n; k++) {
        var a = (k / n) * TWO_PI;
        var f = 1 + rough * (noise(phase + 0.7 * Math.cos(a), phase + 0.7 * Math.sin(a)) * 2 - 1) +
          0.4 * rough * (noise(phase + 3 * Math.cos(a), phase + 3 * Math.sin(a)) * 2 - 1);
        pts.push(P([cx + Math.cos(a) * rx * f, cy + Math.sin(a) * ry * f]));
      }
      return pts;
    }

    // One to three glazes of slightly different size and position, so the
    // blot shows overlapping translucent layers and soft, uneven edges.
    function blot(i) {
      var o = origin(i);
      var cx = o[0] + TILE / 2;
      var cy = o[1] + TILE / 2;
      var aspect = random(1.2, 1.9);
      var rx = TILE * random(0.24, 0.32);
      var ry = rx / aspect;
      var glazes = floor(random(2, 4));
      brush.noStroke();
      for (var g = 0; g < glazes; g++) {
        var s = random(0.7, 1.05);
        brush.fill(0, 0, 0, random(50, 110));
        brush.fillBleed(random(0.3, 0.55), "out");
        brush.fillTexture(random(0.15, 0.4), random(0.1, 0.3), true);
        brush.polygon(outline(
          cx + random(-0.2, 0.2) * rx, cy + random(-0.2, 0.2) * ry,
          rx * s, ry * s, random(0.25, 0.45), 56));
      }
      brush.noFill();
      // Some blots shed a little dust along their length.
      if (random() < 0.35) {
        brush.set("dust", "#000000", random(1.5, 2.5));
        brush.spline([P([cx - rx * 1.3, cy]), P([cx, cy + random(-0.3, 0.3) * ry]), P([cx + rx * 1.4, cy])], 0.5);
      }
    }

    // A trail of dust: a few spray strokes along x, drifting apart.
    function spray(i) {
      var o = origin(i);
      var y0 = o[1] + TILE / 2;
      brush.set("dust", "#000000", random(1.5, 3));
      for (var k = floor(random(1, 3)); k > 0; k--) {
        var y = y0 + random(-0.12, 0.12) * TILE;
        var pts = [];
        for (var x = 0.08; x <= 0.92; x += 0.12) {
          pts.push(P([o[0] + x * TILE, y + random(-0.03, 0.03) * TILE]).concat([1 - 0.6 * x]));
        }
        brush.spline(pts, 0.5);
      }
    }

    // A jagged, hand-drawn line along x: uneven steps that sometimes double
    // back, drawn with a wobble, in a pencil or charcoal.
    function zigzag(i) {
      var o = origin(i);
      var y0 = o[1] + TILE / 2;
      var amp = random(0.06, 0.16) * TILE;
      var pts = [];
      var x = 0.1;
      var up = random() < 0.5;
      while (x < 0.9) {
        var y = y0 + (up ? -1 : 1) * amp * random(0.2, 1);
        pts.push(P([o[0] + x * TILE, y]));
        x += random() < 0.15 ? -random(0.02, 0.05) : random(0.05, 0.16);
        if (random() < 0.8) up = !up;
      }
      brush.wiggle(random(0.5, 1.5));
      brush.set(random(["HB", "2B", "charcoal", "cpencil"]), "#000000", random(1, 1.8));
      brush.spline(pts, random(0, 0.15));
      brush.noField();
    }

    function setup() {
      createCanvas(W, H, WEBGL);
      pixelDensity(1);
      randomSeed(SEED);
      noiseSeed(SEED);
      background(255);
      brush.scaleBrushes(BRUSH_SCALE);
      // Fine, sparse dust. For a spray brush the stroke weight sets how far
      // the dots scatter, not their size.
      brush.add("dust", {
        type: "spray", weight: 0.6, scatter: 8, grain: 6, opacity: 140, spacing: 1.2,
        pressure: [1, 0.6]
      });
      brush.noField();
      for (var i = 0; i < COUNT; i++) {
        if (i < BLOBS) blot(i);
        else if (i < BLOBS + SPRAYS) spray(i);
        else zigzag(i);
      }
    }

    function ramp(e0, e1, x) {
      var t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
      return t * t * (3 - 2 * t);
    }

    // p5.brush composites the painting when setup() returns. Each tile is
    // normalised to its own densest pixel and faded out at its border, so
    // no sprite carries a seam from its neighbour.
    function draw() {
      noLoop();
      loadPixels();
      var d = pixelDensity();
      var out = document.createElement("canvas");
      out.width = W;
      out.height = H;
      var ctx = out.getContext("2d");
      var img = ctx.createImageData(W, H);
      for (var i = 0; i < COUNT; i++) {
        var o = origin(i);
        var max = 0;
        var x, y, k, v;
        var dens = new Float32Array(TILE * TILE);
        for (y = 0; y < TILE; y++) {
          for (x = 0; x < TILE; x++) {
            k = 4 * ((o[1] + y) * d * W * d + (o[0] + x) * d);
            v = 1 - (pixels[k] + pixels[k + 1] + pixels[k + 2]) / 765;
            var edge = i < BLOBS ?
              ramp(TILE * 0.5, TILE * 0.44, Math.hypot(x - TILE / 2, y - TILE / 2)) :
              ramp(0, 6, Math.min(x, y, TILE - 1 - x, TILE - 1 - y));
            dens[y * TILE + x] = v * edge;
            max = Math.max(max, v * edge);
          }
        }
        for (y = 0; y < TILE; y++) {
          for (x = 0; x < TILE; x++) {
            var q = 4 * ((o[1] + y) * W + o[0] + x);
            img.data[q] = img.data[q + 1] = img.data[q + 2] = 255;
            img.data[q + 3] = Math.round(255 * Math.pow(dens[y * TILE + x] / (max || 1), 0.85));
          }
        }
      }
      ctx.putImageData(img, 0, 0);
      var url = out.toDataURL("image/webp", 0.9);
      window.atlasDataURL = url;

      var link = document.createElement("a");
      link.href = url;
      link.download = "washes.webp";
      link.textContent = "Download washes.webp";
      document.getElementById("status").replaceChildren(link);
      var preview = document.createElement("img");
      preview.src = url;
      document.body.appendChild(preview);
    }
  </script>
</body>
</html>
